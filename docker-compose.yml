services:
  kiro-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kiro-gateway
    ports:
      - "8000:80"
    environment:
      - PORT=80
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Persist the SQLite DB (accounts, clients, usage, admin password)
      - ./data/admin.db:/app/admin.db
      # Persist the downloaded kiro-cli binary so it isn't re-downloaded
      - ./data/bin:/app/bin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
